name: Ruff
on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/ruff.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/ruff.yml"
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff format
        run: ruff format --output-format=github "**/*.py"
      - name: Ruff check & fix
        run: ruff check --fix --output-format=github "**/*.py"
