[project]
name = "redimind"
version = "0.1.0"
description = "Curated shared memory for coding agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "redis>=6,<8",
  "uvicorn>=0.34,<1",
]

[project.scripts]
redimind = "redimind.cli:main"
redimind-server = "redimind.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/redimind"]
sources = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
